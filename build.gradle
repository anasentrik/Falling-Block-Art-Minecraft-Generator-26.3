plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
}

dependencies {
    // To change the versions see the gradle.properties file
    // Since 26.1 Minecraft is no longer obfuscated, so no mappings are needed.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    def version = project.version
    def minecraftVersion = project.minecraft_version
    def loaderVersion = project.loader_version
    inputs.property "version", version
    inputs.property "minecraft_version", minecraftVersion
    inputs.property "loader_version", loaderVersion
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": version,
                "minecraft_version": minecraftVersion,
                "loader_version": loaderVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

java {
    // Loom will automatically attach sourcesJar to the "build" task if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    def projectName = project.archives_base_name
    inputs.property "projectName", projectName

    // e.g. experiments-26.3-v2.jar ; bump build_tag (v3, v4, ...) for every new release
    archiveFileName = "${project.archives_base_name}-${project.minecraft_version}-${project.build_tag}.jar"

    from("LICENSE") {
        rename { "${it}_$projectName" }
    }
}

// Copies the finished jar into releases/ so older versions (v2, v3, ...) are kept side by side.
// Deliberately not a Copy task: Gradle deletes the previous outputs of a Copy task, which would remove older jars.
def copyRelease = tasks.register("copyRelease") {
    def jarFile = tasks.named("jar").flatMap { it.archiveFile }
    def releasesDir = layout.projectDirectory.dir("releases").asFile
    dependsOn(tasks.named("jar"))
    doLast {
        def source = jarFile.get().asFile
        def target = new File(releasesDir, source.name)
        releasesDir.mkdirs()
        if (target.exists()) {
            logger.warn("releases/${source.name} already exists and is kept; bump build_tag for a new release.")
        } else {
            java.nio.file.Files.copy(source.toPath(), target.toPath())
            logger.lifecycle("Release saved to releases/${source.name}")
        }
    }
}

tasks.named("build") {
    finalizedBy(copyRelease)
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
